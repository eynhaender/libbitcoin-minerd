# Fully simulated miner: 3 chains of CPU-hashing "chips", local job source.
# Runs anywhere:  ./build/minerd --profile profiles/sim.ini

[board]
name     = simulator
platform = sim

[psu]
type      = sim
voltage_v = 14.0

[chain.0]
chip            = SIM
chips           = 4
regulator       = sim
voltage_v       = 13.8
frequency_mhz   = 400
chip_difficulty = 0.00005      # tiny so the CPU finds nonces quickly
sim_max_mhs     = 1.5          # cap CPU use per chain
sim_hw_error_rate = 0.01       # exercise host-side verification
sim_temp_base_c = 52

[chain.1]
chip            = SIM
chips           = 4
regulator       = sim
voltage_v       = 13.8
frequency_mhz   = 400
chip_difficulty = 0.00005
sim_max_mhs     = 1.5
sim_temp_base_c = 50

[chain.2]
chip            = SIM
chips           = 4
regulator       = sim
voltage_v       = 13.8
frequency_mhz   = 400
chip_difficulty = 0.00005
sim_max_mhs     = 1.5
sim_temp_base_c = 48

[fan.0]
type = sim
[fan.1]
type = sim

[safety]
max_chip_temp_c   = 85
shutdown_temp_c   = 95
min_fan_rpm       = 500

[thermal]
target_temp_c   = 60
min_fan_percent = 30

[tuning]
enabled    = true
interval_s = 20
step_mhz   = 6.25

[pool]
url  = local-test
user = sim.worker
suggest_difficulty = 0.0002

[api]
bind = 127.0.0.1
port = 4028
