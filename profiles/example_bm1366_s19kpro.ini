# Example of switching miner models: same daemon, different chip driver.
# Only the profile changes – BM1366 is registered in the ChipRegistry.
#
# !!! EVERY device path, GPIO and I2C address below is a PLACEHOLDER. !!!
# Determine them on your board (dmesg, /proc/tty/driver/*, stock firmware
# scripts in /etc/init.d, i2cdetect) and record them in docs/PORTING.md.
# The BM1362 driver, APW12 and PIC drivers are not yet verified and the PSU /
# PIC drivers fail closed (Status::not_implemented) until implemented.

[board]
name     = Antminer S19k Pro (Amlogic) – BM1366 example
platform = amlogic
i2c_bus  = /dev/i2c-0                 # VERIFY
allow_unverified_chips = false        # set true ONLY on a current-limited bench setup

[psu]
type      = apw12                     # or "none" with a bench supply
voltage_v = 14.4                      # VERIFY against stock logs
i2c_addr  = 0x10                      # VERIFY

[chain.0]
chip          = BM1366
chips         = 77              # VERIFY per hashboard SKU
uart          = /dev/ttyS1            # VERIFY
baud          = 115200
fast_baud     = 3000000               # used once BM1362 fast-UART value is known
reset_gpio    = 45                    # VERIFY
regulator     = pic                   # "dcdc-direct" for noPIC hashboards
regulator_i2c_addr = 0x20             # VERIFY
voltage_v     = 13.8                  # VERIFY
frequency_mhz = 485
chip_difficulty = 256

[chain.1]
chip          = BM1366
chips         = 77              # VERIFY per hashboard SKU
uart          = /dev/ttyS2            # VERIFY
baud          = 115200
reset_gpio    = 47                    # VERIFY
regulator     = pic
regulator_i2c_addr = 0x21             # VERIFY
voltage_v     = 13.8
frequency_mhz = 485
chip_difficulty = 256

[chain.2]
chip          = BM1366
chips         = 77              # VERIFY per hashboard SKU
uart          = /dev/ttyS3            # VERIFY
baud          = 115200
reset_gpio    = 44                    # VERIFY
regulator     = pic
regulator_i2c_addr = 0x22             # VERIFY
voltage_v     = 13.8
frequency_mhz = 485
chip_difficulty = 256

# Fans: on Bitmain boards PWM/tach are often exposed through custom drivers;
# point these at whatever sysfs files your kernel provides.
[fan.0]
type = hwmon
pwm  = /sys/class/pwm/pwmchip0/pwm0/duty_cycle   # VERIFY (may need pwm_max = period in ns)
rpm  = /sys/class/hwmon/hwmon0/fan1_input        # VERIFY
pwm_max = 255

[safety]
max_chip_temp_c     = 85
max_board_temp_c    = 80
shutdown_temp_c     = 95
min_fan_rpm         = 1500
telemetry_timeout_s = 5
heartbeat_timeout_s = 10
require_temperature = true          # hashboard temps come through the ASIC I2C passthrough (TODO)

[thermal]
target_temp_c   = 70
min_fan_percent = 40

[tuning]
enabled           = false           # enable after the stock-frequency run is stable
step_mhz          = 6.25
max_hw_error_rate = 0.002
interval_s        = 300

[pool]
# Your own libbitcoin-server (bs) stratum endpoint, or any Stratum V1 pool:
url  = stratum+tcp://192.168.1.10:3333
user = bc1qyouraddress.s19jpro01
password = x

[api]
bind = 127.0.0.1
port = 4028
